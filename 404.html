<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404: Not Found — abindent</title>
  <meta name="description" content="404 — This page does not exist or has been moved.">

  <link rel="icon" href="https://github.com/abindent.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════
        RESET & ROOT (Matching index.html)
       ════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0D1117;
      --bg-1:     #161B22;
      --bg-2:     #21262D;
      --pink:     #F85D7F;
      --gold:     #F8D866;
      --text:     #c9d1d9;
      --muted:    #8b949e;
      --border:   rgba(248, 93, 127, 0.14);
      --border-2: rgba(255,255,255,0.06);
      --glow:     rgba(248, 93, 127, 0.25);
      --mono:     'JetBrains Mono', monospace;
      --display:  'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    a { color: inherit; text-decoration: none; }

    /* ════════════════════════════════════
        BACKGROUND LAYERS
       ════════════════════════════════════ */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(248,93,127,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(248,93,127,0.025) 1px, transparent 1px);
      background-size: 52px 52px;
      pointer-events: none;
      z-index: 0;
    }

    .noise-bg {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }

    /* ════════════════════════════════════
        CONTAINER & TERMINAL
       ════════════════════════════════════ */
    .container {
      width: 100%;
      max-width: 650px;
      padding: 0 24px;
      position: relative;
      z-index: 2;
    }

    .terminal-window {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 24px 80px rgba(0,0,0,0.5),
        0 0 80px rgba(248,93,127,0.06);
      animation: fadeUp 0.6s ease both;
    }

    .terminal-bar {
      background: var(--bg-2);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid var(--border);
    }

    .tb-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .tb-dot.r { background: #FF5F56; }
    .tb-dot.y { background: #FFBD2E; }
    .tb-dot.g { background: #27C93F; }

    .tb-title {
      font-size: 12px;
      color: var(--muted);
      margin: 0 auto;
      letter-spacing: 0.02em;
    }

    .terminal-body { padding: 40px; }

    .t-prompt {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .t-prompt .u { color: var(--pink); }
    .t-prompt .h { color: var(--gold); }

    /* ════════════════════════════════════
        CONTENT ELEMENTS
       ════════════════════════════════════ */
    .error-code {
      font-family: var(--display);
      font-size: clamp(64px, 12vw, 90px);
      font-weight: 800;
      color: #fff;
      line-height: 1;
      margin-bottom: 10px;
      letter-spacing: -0.03em;
      position: relative;
      display: inline-block;
    }

    .error-code .bg-glow {
      position: absolute;
      inset: 0;
      color: var(--pink);
      filter: blur(24px);
      opacity: 0.25;
      user-select: none;
      pointer-events: none;
    }

    .error-msg {
      font-size: 14px;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .error-details {
      font-size: 13px;
      color: var(--muted);
      border-left: 2px solid var(--pink);
      padding-left: 16px;
      margin-bottom: 32px;
    }

    /* Action Link Button */
    .slink {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border-2);
      border-radius: 8px;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--text);
      transition: all 0.22s;
    }

    .slink:hover {
      border-color: var(--pink);
      color: var(--pink);
      background: rgba(248,93,127,0.06);
      box-shadow: 0 0 18px rgba(248,93,127,0.12);
    }

    .slink svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

    /* ════════════════════════════════════
        ANIMATIONS & RESPONSIVE
       ════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .terminal-body { padding: 28px 20px; }
      .container { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="noise-bg"></div>

  <div class="container">
    <div class="terminal-window">
      <div class="terminal-bar">
        <span class="tb-dot r"></span>
        <span class="tb-dot y"></span>
        <span class="tb-dot g"></span>
        <span class="tb-title">abindent@github.io — error_handler — 404</span>
      </div>

      <div class="terminal-body">
        <div class="t-prompt">
          <span class="u">abindent</span><span style="color:var(--muted)">@</span><span class="h">github.io</span><span style="color:var(--muted)">:~$ </span><span style="color:var(--text)">curl -I ./missing-page</span>
        </div>

        <h1 class="error-code">
          <span class="bg-glow" aria-hidden="true">404</span>
          404
        </h1>

        <div class="error-msg">
          &gt; ERROR: PAGE_NOT_FOUND
        </div>

        <div class="error-details">
          The path you are looking for does not exist, has been removed, or is currently undergoing unexpected system maintenance.
        </div>

        <a class="slink" href="https://abindent.github.io/">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          ~/return-home.sh
        </a>
      </div>
    </div>
  </div>

</body>
</html>
